<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>三支筆工作室</title>
<meta name="description" content="三支筆工作室 — 年輕化書法">
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: #f7f5f1;
    color: #1c1a17;
    font-family: "Noto Serif TC", "Songti TC", "PingFang TC", "Heiti TC", serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  main { text-align: center; }
  h1 {
    margin: 0;
    font-size: 34px;
    font-weight: 500;
    letter-spacing: 0.32em;
    text-indent: 0.32em;
    line-height: 1.5;
  }
  .rule {
    width: 40px;
    height: 1px;
    background: #1c1a17;
    opacity: 0.25;
    margin: 26px auto;
  }
  p {
    margin: 0;
    font-size: 14px;
    letter-spacing: 0.22em;
    text-indent: 0.22em;
    opacity: 0.62;
    line-height: 2;
  }
  @media (min-width: 720px) {
    h1 { font-size: 44px; }
    p { font-size: 15px; }
  }
  @media (prefers-color-scheme: dark) {
    body { background: #17150f; color: #efeae0; }
    .rule { background: #efeae0; }
  }
</style>
</head>
<body>
  <main>
    <h1>三支筆工作室</h1>
    <div class="rule"></div>
    <p>年輕化書法</p>
  </main>
</body>
</html>
